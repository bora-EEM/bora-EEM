    <text x="72" y="162" fill="#c9d1d9" textLength="255" lengthAdjust="spacing" clip-path="url(#k8)">Birlikte üretmeye açığım.</text>
    <text x="72" y="162" fill="#c9d1d9" textLength="306" lengthAdjust="spacing" clip-path="url(#k9)">Sizi kuzeylabs.com&#39;a beklerim.</text>
