<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Bora Koruyucu. Elektrik-elektronik mühendisliğinden yapay zekâya: bir devre çipinden çıkan sinyaller bir yapay sinir ağına akıyor.">
  <defs>
