    <text x="72" y="162" fill="#c9d1d9" textLength="380" lengthAdjust="spacing" clip-path="url(#k1)">Elektrik-elektronik mühendis adayıyım.</text>
    <text x="72" y="162" fill="#c9d1d9" textLength="326" lengthAdjust="spacing" clip-path="url(#k2)">Devrelerden yapay zekâya geçtim.</text>
